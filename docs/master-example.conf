# Optional master operator policy for NAT hairpin / SNAT.
# Inert by default. Copy to a LOCAL file and substitute your own addresses.
# Source must be canonical RFC1918 or loopback CIDR; destination numeric IPv4.
# The TEST-NET address below is documentation only, not a usable public server.
# address-map=192.168.50.0/24=203.0.113.10
# Activate with: dptdoom-master --config path/to/your-local-master.conf
# No game-port rewriting, no NAT traversal or reachability verification.
#
# Listen address. The default is loopback, so only this machine can connect.
# Uncomment to accept LAN/Internet clients. A --bind argument still wins over
# this, and an invalid value fails startup instead of falling back to loopback.
# bind=0.0.0.0
#
# Ban list file. One rule per line: an IPv4 address, or IPv4/prefix (CIDR).
# Matching is against the TCP source address, never the advertised address, so a
# peer cannot escape a ban by advertising a different IP.
# A malformed rule stops startup instead of applying a partial list.
# banlist=banlist.txt
#
# Alternative three-mode discovery (all inert until uncommented/configured):
# public-address-mode=dns
# public-host=games.example.org
# hairpin-subnet=192.168.50.0/24
# public-refresh-seconds=300
#
# Manual: public-address-mode=manual + public-ip=203.0.113.10 + hairpin-subnet=...
# HTTPS: public-address-mode=api + public-api=https://api.ipify.org/ + hairpin-subnet=...
# Only ONE mode. API requests disclose the master egress IP to that provider.
